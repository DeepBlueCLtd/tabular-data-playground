name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages now serves from the `gh-pages` branch root. PR previews
# (see pr-preview.yml) live under `/pr-preview/pr-N/` of the same
# branch and must survive each main deploy. peaceiris's
# `keep_files` option preserves files at the destination that the
# new publish does not write.
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish main to gh-pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm (version from app/package.json packageManager field)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - name: Set up Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build for Pages
        env:
          VITE_BASE_PATH: /tabular-data-playground/
        run: pnpm run build

      - name: Publish to gh-pages root (preserve PR previews)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
          publish_branch: gh-pages
          keep_files: true
          commit_message: 'deploy: main @ ${{ github.sha }}'
