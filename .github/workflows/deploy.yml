name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages serves from the `gh-pages` branch root. The published tree is:
#   /                  → static welcome page (web/index.html)
#   /slides/           → reveal.js findings deck (web/slides/)
#   /playground/       → the Vite IDE app (built with a matching base path)
#   /jupyterlite/      → JupyterLite in-browser demo (jupyter lite build)
#   /sample-package/   → lesson 8's self-hosted Data Package (kept at root
#                        so the URL hard-coded in lesson 8 stays valid)
# PR previews (see pr-preview.yml) live under `/pr-preview/pr-N/` of the
# same branch and must survive each main deploy. peaceiris's `keep_files`
# option preserves files at the destination that the new publish does not
# write. NOTE: moving the IDE off the root leaves the previous root-level
# IDE assets behind under `keep_files`; a one-time manual cleanup of stale
# root files on `gh-pages` can remove them (harmless, just dead bytes).
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish main to gh-pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm (version from app/package.json packageManager field)
        # pnpm/action-setup v4, pinned to its commit SHA (supply-chain best practice).
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: app/package.json

      - name: Set up Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build IDE for Pages (served under /playground/)
        env:
          VITE_BASE_PATH: /tabular-data-playground/playground/
        run: pnpm run build

      - name: Set up Python for JupyterLite build
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JupyterLite build dependencies
        working-directory: ${{ github.workspace }}
        run: pip install -r jupyterlite/requirements.txt

      - name: Build JupyterLite demo (served under /jupyterlite/)
        working-directory: ${{ github.workspace }}/jupyterlite
        run: |
          jupyter lite build \
            --output-dir _output \
            --base-url /tabular-data-playground/jupyterlite/

      - name: Verify JupyterLite build produced output
        working-directory: ${{ github.workspace }}/jupyterlite
        run: |
          test -d _output && test -n "$(ls -A _output)"

      - name: Assemble published site (welcome + slides + IDE + jupyterlite + sample-package)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          # Welcome page (/) and slides (/slides/)
          cp -r web/. _site/
          # IDE under /playground/
          mkdir -p _site/playground
          cp -r app/dist/. _site/playground/
          # JupyterLite demo under /jupyterlite/
          mkdir -p _site/jupyterlite
          cp -r jupyterlite/_output/. _site/jupyterlite/
          # Keep the lesson-8 sample package at the gh-pages root
          if [ -d _site/playground/sample-package ]; then
            rm -rf _site/sample-package
            mv _site/playground/sample-package _site/sample-package
          fi

      - name: Publish to gh-pages root (preserve PR previews)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          keep_files: true
          commit_message: 'deploy: main @ ${{ github.sha }}'
