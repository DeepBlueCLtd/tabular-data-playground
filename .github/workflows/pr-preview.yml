name: PR Preview to GitHub Pages

# Builds the full published site for a PR and deploys it under
# `/pr-preview/<N>/` of the gh-pages branch, mirroring the production
# layout:
#   /pr-preview/<N>/             → welcome page (web/index.html)
#   /pr-preview/<N>/slides/      → reveal.js findings deck
#   /pr-preview/<N>/playground/  → the Vite IDE (PR-scoped base path)
#   /pr-preview/<N>/sample-package/ → lesson 8's package, kept at the
#                                     preview root to mirror production
# A single sticky comment (idempotent via the marker below) links to
# the preview. Cleanup on close lives in pr-preview-cleanup.yml.
#
# Only runs for same-repo PRs: fork PRs have no access to the
# `contents: write` token the deploy step needs.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  preview:
    name: Build and publish PR ${{ github.event.pull_request.number }} preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: pr-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm (version from app/package.json packageManager field)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - name: Set up Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies (frozen)
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build IDE with PR-scoped base path
        working-directory: app
        env:
          VITE_BASE_PATH: /tabular-data-playground/pr-preview/${{ github.event.pull_request.number }}/playground/
        run: pnpm run build

      - name: Assemble preview site (welcome + slides + IDE + sample-package)
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/playground
          cp -r app/dist/. _site/playground/
          if [ -d _site/playground/sample-package ]; then
            rm -rf _site/sample-package
            mv _site/playground/sample-package _site/sample-package
          fi

      - name: Deploy preview to gh-pages subfolder
        # JamesIves/github-pages-deploy-action v4.7.3, pinned to its SHA
        # (supply-chain best practice). `clean: true` with `target-folder`
        # scrubs stale files inside this PR's subfolder only, leaving the
        # main deploy and other PR previews untouched.
        uses: JamesIves/github-pages-deploy-action@6c2d9db40f9296374acc17b90404b6e8864128c8
        with:
          branch: gh-pages
          folder: _site
          target-folder: pr-preview/${{ github.event.pull_request.number }}
          clean: true
          commit-message: 'preview: PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}'

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const base = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-preview/${pr}/`;
            const marker = '<!-- tdp-pr-preview -->';
            const body = [
              marker,
              '🚀 **PR preview deployed**',
              '',
              `- Welcome page: ${base}`,
              `- Findings slides: ${base}slides/`,
              `- IDE: ${base}playground/`,
              '',
              `Built from \`${sha}\`. Updates on every push to this PR; removed when the PR closes.`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }
